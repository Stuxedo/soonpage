<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://global.media.stuxedo.com/icon.png">
    <meta name="description" content="Page not found — Stuxedo">
    <title>Page Not Found — Stuxedo</title>
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #051e03; --text-1: #eef2ee; --text-2: rgba(238, 242, 238, 0.55);
            --accent: #00ac00; --accent-bg: rgba(0, 172, 0, 0.12); --accent-border-strong: rgba(0, 172, 0, 0.35);
            --accent-border-hover: rgba(0, 172, 0, 0.55); --accent-hover: rgba(0, 172, 0, 0.22);
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #e8ffe6; --text-1: #081008; --text-2: rgba(0, 0, 0, 0.55);
                --accent: #006400; --accent-bg: rgba(0, 100, 0, 0.07); --accent-border-strong: rgba(0, 100, 0, 0.28);
                --accent-border-hover: rgba(0, 100, 0, 0.45); --accent-hover: rgba(0, 100, 0, 0.13);
            }
        }
        :root.theme-light {
            --bg: #e8ffe6; --text-1: #081008; --text-2: rgba(0, 0, 0, 0.55);
            --accent: #006400; --accent-bg: rgba(0, 100, 0, 0.07); --accent-border-strong: rgba(0, 100, 0, 0.28);
            --accent-border-hover: rgba(0, 100, 0, 0.45); --accent-hover: rgba(0, 100, 0, 0.13);
        }
        :root.theme-dark {
            --bg: #051e03; --text-1: #eef2ee; --text-2: rgba(238, 242, 238, 0.55);
            --accent: #00ac00; --accent-bg: rgba(0, 172, 0, 0.12); --accent-border-strong: rgba(0, 172, 0, 0.35);
            --accent-border-hover: rgba(0, 172, 0, 0.55); --accent-hover: rgba(0, 172, 0, 0.22);
        }

        html, body {
            background: var(--bg); color: var(--text-1); font-family: 'Inter', sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            text-align: center; transition: background 0.3s, color 0.3s;
        }

        a, a:visited { color: var(--accent) !important; text-decoration: none !important; }
        a:hover, a:focus { opacity: 0.8; }

        .wrapper { padding: 2rem 1.5rem; max-width: 420px; }

        .code {
            font-family: 'Stuxedo Tale', 'Exo 2', sans-serif; font-weight: 800;
            font-size: clamp(3.5rem, 12vw, 5.5rem); line-height: 1; color: var(--accent); margin-bottom: 0.5rem;
        }
        h1 { font-family: 'Stuxedo Tale', 'Exo 2', sans-serif; font-weight: 700; font-size: clamp(1.3rem, 4vw, 1.7rem); margin-bottom: 0.75rem; }
        p { color: var(--text-2); font-size: 0.95rem; line-height: 1.7; font-weight: 300; margin-bottom: 1.75rem; }

        .home-link {
            display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 10px;
            font-size: 14px; font-weight: 500; border: 1px solid var(--accent-border-strong);
            background: var(--accent-bg); transition: background 0.2s, border-color 0.2s;
        }
        .home-link:hover { background: var(--accent-hover); border-color: var(--accent-border-hover); opacity: 1 !important; }

        #theme-toggle {
            position: fixed; top: 14px; right: 14px; z-index: 100;
            background: var(--accent-bg); border: 1px solid var(--accent-border-strong); border-radius: 50%;
            width: 38px; height: 38px; font-size: 17px; line-height: 38px; text-align: center; cursor: pointer;
            padding: 0; color: var(--accent); transition: background 0.2s, border-color 0.2s;
        }
        #theme-toggle:hover { background: var(--accent-hover); border-color: var(--accent-border-hover); }
    </style>
</head>
<body>
    <button id="theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">&#9788;</button>

    <div class="wrapper">
        <div class="code">404</div>
        <h1>Page not found</h1>
        <p>Whatever you were looking for isn't here &mdash; the link might be old, or the page might have moved.</p>
        <a class="home-link" href="./">&larr; Back to Stuxedo</a>
    </div>

    <script>
        (function () {
            var root = document.documentElement;
            var btn = document.getElementById('theme-toggle');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var stored = localStorage.getItem('stuxedo-theme');
            var isDark = stored ? stored === 'dark' : prefersDark;

            function apply(dark) {
                root.classList.toggle('theme-dark', dark);
                root.classList.toggle('theme-light', !dark);
                btn.textContent = dark ? '☀' : '☾';
                btn.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
            }

            apply(isDark);

            btn.addEventListener('click', function () {
                isDark = !isDark;
                localStorage.setItem('stuxedo-theme', isDark ? 'dark' : 'light');
                apply(isDark);
            });
        })();
    </script>
</body>
</html>
